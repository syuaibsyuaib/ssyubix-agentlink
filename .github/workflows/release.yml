name: Release Python Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-distributions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build ./python

      - name: Verify release version matches pyproject.toml
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path("python/pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          assert match, "version missing from python/pyproject.toml"
          expected = match.group(1)

          dist = Path("python/dist")
          wheels = list(dist.glob(f"ssyubix-{expected}-*.whl"))
          sdists = list(dist.glob(f"ssyubix-{expected}.tar.gz"))
          assert wheels and sdists, f"built artifacts missing for {expected}: {sorted(p.name for p in dist.iterdir())}"

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/v"):
              tag = ref.rsplit("/", 1)[-1].removeprefix("v")
              assert tag == expected, f"git tag {tag!r} != package version {expected!r}"
              print(f"tag v{tag} matches package {expected}")
          else:
              print(f"workflow_dispatch build for package {expected} (no tag check)")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: python/dist/

  publish-to-pypi:
    if: github.repository == 'syuaibsyuaib/ssyubix-agentlink'
    needs: build-distributions
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/ssyubix
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      # PyPI menolak unggahan file yang sudah ada dengan 400, sehingga menjalankan
      # ulang rilis untuk versi yang sama — atau memindahkan tag yang salah arah —
      # membuat workflow gagal padahal paketnya sudah terbit dengan benar.
      # skip-existing membuat langkah ini idempoten: yang belum ada diunggah, yang
      # sudah ada dilewati.
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
